name: Deploy Blog to Nekoweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies and build
        run: |
          npm install
          chmod -R +x node_modules/.bin
          npm run build

      - name: Deploy ONLY the blog to Nekoweb
        uses: mp-pinheiro/nekoweb-deploy@0.3.0
        with:
          API_KEY: ${{ secrets.NEKOWEB_API_KEY }}
          BUILD_DIR: './public/blog'             # <-- ONLY look at the blog folder!
          DEPLOY_DIR: '/karhukarhu.place/blog'   # <-- ONLY put it in the blog folder!
          CLEANUP: 'False'                       # <-- Don't delete anything, just update
          DELAY: '1'                             # <-- 1 second is plenty fast for just a few files
          NEKOWEB_PAGENAME: 'karhukarhu'
