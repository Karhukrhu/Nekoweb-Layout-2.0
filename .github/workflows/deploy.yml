name: Deploy Full Site to Nekoweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies and build
        run: |
          npm install
          chmod -R +x node_modules/.bin
          npm run build

      - name: Deploy to Nekoweb
        uses: mp-pinheiro/nekoweb-deploy@0.3.0
        with:
          API_KEY: ${{ secrets.NEKOWEB_API_KEY }}
          BUILD_DIR: './public'             # <-- Copies EVERYTHING Eleventy built!
          DEPLOY_DIR: '/karhukarhu.place'   # <-- Puts it in the right place!
          CLEANUP: 'True'                   # <-- Cleans up the old broken files!
          DELAY: '4'                        # <-- 3 seconds per file. Beats the rate limit!
          NEKOWEB_PAGENAME: 'karhukarhu'
